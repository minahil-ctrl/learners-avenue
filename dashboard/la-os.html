<title>Learners' Avenue OS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
:root {
  --bg:#07111E; --sb:#091827; --surf:#0D2035; --surf2:#112640; --card:#162C47;
  --bdr:#1C3550; --bdr2:#284D72; --txt:#C8DCF0; --txt2:#6B8FAD; --txt3:#30506A;
  --gold:#D4A853; --gold-d:rgba(212,168,83,.09); --gold-l:rgba(212,168,83,.28);
  --p0:#E06868; --p0d:rgba(224,104,104,.10);
  --p1:#3EC9BF; --p1d:rgba(62,201,191,.08);
  --p2:#4A6880; --p2d:rgba(74,104,128,.08);
  --mr:#38B2AA; --str:#9D84D8; --tech:#5898E0; --tut:#D4A853; --gtm:#D86890; --fin:#52B872;
  --s-draft:#4A6880; --s-prog:#5898E0; --s-block:#E06868; --s-done:#3DB878; --s-need:#E8A820; --s-post:#8B74D8;
  --r:8px; --r-sm:5px; --mono:'Space Mono',monospace; --sans:'Sora',system-ui,sans-serif;
}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){
  --bg:#F2F6FC; --sb:#E6EDF8; --surf:#fff; --surf2:#EEF4FC; --card:#fff;
  --bdr:#CBD8EE; --bdr2:#A8BFE0; --txt:#0A1828; --txt2:#3D5C80; --txt3:#8DAAC8;
  --gold-d:rgba(160,120,30,.07); --gold-l:rgba(160,120,30,.22);
}}
:root[data-theme=light]{
  --bg:#F2F6FC; --sb:#E6EDF8; --surf:#fff; --surf2:#EEF4FC; --card:#fff;
  --bdr:#CBD8EE; --bdr2:#A8BFE0; --txt:#0A1828; --txt2:#3D5C80; --txt3:#8DAAC8;
  --gold-d:rgba(160,120,30,.07); --gold-l:rgba(160,120,30,.22);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:13.5px;line-height:1.55;display:flex;flex-direction:column}

/* TOP BAR */
.topbar{height:54px;background:var(--sb);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 20px;gap:14px;flex-shrink:0;z-index:20;position:relative}
.topbar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold) 0%,transparent 100%);opacity:.3}
.logo{font-size:15px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;margin-right:6px;flex-shrink:0}
.logo span{color:var(--gold)}
.chips{display:flex;gap:7px;align-items:center;flex:1;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-family:var(--mono);font-size:10px;border:1px solid;white-space:nowrap;flex-shrink:0;font-weight:700;letter-spacing:.02em}
.c-gold{background:var(--gold-d);border-color:var(--gold-l);color:var(--gold)}
.c-red{background:var(--p0d);border-color:rgba(224,104,104,.25);color:var(--p0)}
.c-warn{background:rgba(232,168,32,.10);border-color:rgba(232,168,32,.28);color:var(--s-need)}
.c-mute{background:transparent;border-color:var(--bdr);color:var(--txt3)}
.vtog{display:flex;background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r-sm);overflow:hidden;margin-left:auto;flex-shrink:0}
.vbtn{padding:6px 14px;font-size:11px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--txt2);font-family:var(--sans);transition:all .12s;letter-spacing:.01em}
.vbtn.on{background:var(--surf2);color:var(--txt)}

/* LAYOUT */
.layout{display:flex;flex:1;min-height:0}

/* SIDEBAR */
.sidebar{width:224px;flex-shrink:0;background:var(--sb);border-right:1px solid var(--bdr);overflow-y:auto;padding:18px 0 12px}
.slabel{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--txt3);padding:0 16px 10px}
.sitem{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;border-left:3px solid transparent;transition:all .12s;user-select:none}
.sitem:hover{background:rgba(255,255,255,.025)}
.sitem.on{background:rgba(255,255,255,.045);border-left-color:var(--dc)}
.sitem.on .sname{color:var(--txt)}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--dc);flex-shrink:0;box-shadow:0 0 6px var(--dc)}
.sname{font-size:12.5px;font-weight:600;color:var(--txt2);flex:1;line-height:1.3}
.sbadges{display:flex;gap:4px;align-items:center}
.sbadge{font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:4px;font-weight:700;letter-spacing:.02em}
.sb-r{background:var(--p0d);color:var(--p0);border:1px solid rgba(224,104,104,.2)}
.sb-w{background:rgba(232,168,32,.10);color:var(--s-need);border:1px solid rgba(232,168,32,.2)}
.ssep{height:1px;background:var(--bdr);margin:12px 0}

/* MAIN */
.main{flex:1;overflow-y:auto;padding:26px 30px 26px;min-width:0}

/* DOMAIN HEADER */
.dh{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.dtag-lg{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:5px 11px;border-radius:var(--r-sm)}
.dtitle{font-size:19px;font-weight:700;letter-spacing:-.02em}
.dsub{font-size:12px;color:var(--txt2);font-weight:400}

/* PROGRESS BAR */
.pbar-wrap{margin-bottom:20px}
.pbar-meta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.pbar-label{font-size:11px;color:var(--txt2);font-weight:600}
.pbar-pct{font-family:var(--mono);font-size:11px;color:var(--txt2)}
.pbar-track{height:4px;background:var(--bdr);border-radius:2px;overflow:hidden}
.pbar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--p0),var(--gold));transition:width .3s ease}

/* URGENT STRIP */
.ustrip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.ucard{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:13px 15px;cursor:pointer;transition:all .15s}
.ucard:hover{border-color:var(--bdr2);transform:translateY(-1px)}
.ucard.p0{border-left:3px solid var(--p0)}
.ucard.p1{border-left:3px solid var(--p1)}
.ucard-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px}
.uid{font-family:var(--mono);font-size:10px;color:var(--txt3);font-weight:700;letter-spacing:.04em}
.udays{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.02em}
.udays.hot{color:var(--p0)}.udays.warm{color:var(--s-need)}.udays.ok{color:var(--p1)}
.utitle{font-size:12.5px;font-weight:600;color:var(--txt);line-height:1.4}

/* TABS */
.tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:1px solid var(--bdr)}
.tab{padding:8px 16px;font-size:12.5px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--txt2);font-family:var(--sans);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .12s;letter-spacing:.01em}
.tab.on{color:var(--txt);border-bottom-color:var(--dc)}
.tab:hover:not(.on){color:var(--txt)}
.tbadge{font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:3px;margin-left:5px;background:var(--p0d);color:var(--p0);font-weight:700}

/* TASK TABLE */
.tw{overflow-x:auto}
table.tt{width:100%;border-collapse:collapse;font-size:13px}
.tt th{font-size:10px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;color:var(--txt3);padding:8px 12px;text-align:left;border-bottom:2px solid var(--bdr);white-space:nowrap;background:var(--bg);position:sticky;top:0;z-index:1}
.tt td{padding:11px 12px;border-bottom:1px solid var(--bdr);vertical-align:middle}
.tt tr.tr{cursor:pointer}
.tt tr.tr:hover td{background:rgba(255,255,255,.02)}
.tt tr.tr.ex td{background:rgba(255,255,255,.025)}
.tt tr.td-row td{padding:0;border-bottom:1px solid var(--bdr)}
.td-inner{padding:16px 20px 16px 52px;background:var(--surf2);font-size:12.5px;color:var(--txt2);line-height:1.65}
.td-desc{margin-bottom:14px;color:var(--txt2);font-size:12.5px;line-height:1.65}
.td-out{margin-bottom:14px;border-left:3px solid var(--gold);padding-left:14px}
.td-out-label{font-size:10px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;opacity:.8}
.td-out-body{font-size:12px;color:var(--txt);line-height:1.75;white-space:pre-wrap;font-family:var(--mono);background:rgba(0,0,0,.15);padding:12px 14px;border-radius:var(--r-sm)}
.td-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4px}
.tlabel{font-size:10px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;color:var(--txt3);margin-bottom:5px;display:block}
.tid{font-family:var(--mono);font-size:11px;color:var(--txt3);white-space:nowrap;letter-spacing:.04em}
.ttitle{font-weight:500;color:var(--txt);font-size:13px}
.tdate{font-family:var(--mono);font-size:11px;white-space:nowrap;font-weight:700;letter-spacing:.02em}
.tdate.hot{color:var(--p0)}.tdate.warm{color:var(--s-need)}.tdate.ok{color:var(--p1)}.tdate.dn{color:var(--txt3);text-decoration:line-through}
.prio{font-family:var(--mono);font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;letter-spacing:.04em}
.pP0{background:var(--p0d);color:var(--p0)}.pP1{background:var(--p1d);color:var(--p1)}.pP2{background:var(--p2d);color:var(--p2)}
.sbtn{font-family:var(--mono);font-size:10px;font-weight:700;padding:3px 9px;border-radius:4px;cursor:pointer;border:none;white-space:nowrap;transition:all .12s;letter-spacing:.03em}
.sbtn:hover{filter:brightness(1.15)}
.sDraft{background:rgba(74,104,128,.18);color:var(--s-draft)}
.sProgress{background:rgba(88,152,224,.18);color:var(--s-prog)}
.sBlocked{background:rgba(224,104,104,.18);color:var(--s-block)}
.sDone{background:rgba(61,184,120,.15);color:var(--s-done)}
.sNeedsApproval{background:rgba(232,168,32,.15);color:var(--s-need);border:1px solid rgba(232,168,32,.3)}
.sApproved{background:rgba(61,184,120,.15);color:var(--s-done);border:1px solid rgba(61,184,120,.3)}
.sPosted{background:rgba(139,116,216,.15);color:var(--s-post)}
.deps{display:flex;flex-wrap:wrap;gap:5px}
.dep{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:4px;background:var(--surf2);border:1px solid var(--bdr);color:var(--txt2);cursor:pointer;white-space:nowrap;transition:all .12s;font-weight:700;letter-spacing:.03em}
.dep:hover{border-color:var(--bdr2);color:var(--txt)}
.blk{font-size:12px;color:var(--s-block);font-weight:600}
.xi{color:var(--txt3);font-size:11px;transition:transform .15s;display:inline-block;font-weight:700}
.xi.o{transform:rotate(90deg);color:var(--txt2)}
.dom-MR{background:rgba(56,178,170,.12);color:var(--mr)}
.dom-STR{background:rgba(157,132,216,.12);color:var(--str)}
.dom-TECH{background:rgba(88,152,224,.12);color:var(--tech)}
.dom-TUT{background:rgba(212,168,83,.12);color:var(--tut)}
.dom-GTM{background:rgba(216,104,144,.12);color:var(--gtm)}
.dom-FIN{background:rgba(82,184,114,.12);color:var(--fin)}
.dtag{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:4px;white-space:nowrap}

/* CONTENT QUEUE */
.cq{display:flex;flex-direction:column;gap:12px}
.cc{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden}
.cc-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--bdr);cursor:pointer;flex-wrap:wrap;transition:background .12s}
.cc-head:hover{background:rgba(255,255,255,.02)}
.cplat{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:rgba(216,104,144,.12);color:var(--gtm);border:1px solid rgba(216,104,144,.2)}
.ctype{font-size:11.5px;color:var(--txt2)}
.ctitle{font-size:14px;font-weight:600;color:var(--txt);flex:1;letter-spacing:-.01em}
.cacts{display:flex;align-items:center;gap:8px;flex-shrink:0}
.abtn{padding:5px 14px;border-radius:var(--r-sm);font-size:12px;font-weight:600;cursor:pointer;border:1px solid;font-family:var(--sans);transition:all .12s;letter-spacing:.01em}
.btn-ok{background:rgba(61,184,120,.12);border-color:rgba(61,184,120,.32);color:var(--s-done)}
.btn-ok:hover{background:rgba(61,184,120,.22)}
.btn-ed{background:transparent;border-color:var(--bdr);color:var(--txt2)}
.btn-ed:hover{color:var(--txt);border-color:var(--bdr2)}
.btn-pt{background:rgba(139,116,216,.12);border-color:rgba(139,116,216,.32);color:var(--s-post)}
.btn-pt:hover{background:rgba(139,116,216,.22)}
.cc-body{padding:18px;display:none;border-top:1px solid var(--bdr)}
.cc-body.o{display:block}
.caption{background:var(--surf2);border:1px solid var(--bdr);border-radius:var(--r-sm);padding:16px 18px;font-size:13px;color:var(--txt);line-height:1.85;white-space:pre-wrap;margin-bottom:16px;font-family:var(--sans)}
.cfoot{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cnote{font-size:12px;color:var(--txt2);line-height:1.6}

/* RESOURCES */
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.rc{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:16px 18px}
.rtype{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--txt3);margin-bottom:5px}
.rname{font-size:13.5px;font-weight:600;color:var(--txt);margin-bottom:4px;letter-spacing:-.01em}
.rdesc{font-size:11.5px;color:var(--txt2);line-height:1.55}
.rstatus{margin-top:10px;display:flex;align-items:center;gap:7px}
.rdot{width:7px;height:7px;border-radius:50%}
.rdot.exists{background:var(--s-done);box-shadow:0 0 5px var(--s-done)}
.rdot.pending{background:var(--s-need)}
.rdot.draft{background:var(--s-draft)}
.rsl{font-size:11.5px;color:var(--txt2);font-weight:500}

/* STAGE SECTION */
.ss{margin-bottom:34px}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sbig{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border-radius:4px}
.sbig.p0{background:var(--p0d);color:var(--p0);border:1px solid rgba(224,104,104,.25)}
.sbig.p1{background:var(--p1d);color:var(--p1);border:1px solid rgba(62,201,191,.25)}
.sbig.p2{background:var(--p2d);color:var(--p2);border:1px solid rgba(74,104,128,.25)}
.stitle{font-size:16px;font-weight:700;letter-spacing:-.02em}
.scnt{font-family:var(--mono);font-size:11px;color:var(--txt2)}
.snote{font-size:11.5px;color:var(--txt2)}

.mt2{margin-top:10px}
.empty{padding:36px;text-align:center;color:var(--txt3);font-size:13.5px;font-style:italic}
.dash{color:var(--txt3)}

/* scrollbar */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--txt3)}
</style>

<div class="topbar" id="TB"></div>
<div class="layout">
  <div class="sidebar" id="SB"></div>
  <div class="main" id="MAIN"></div>
</div>

<script>
/* DATA */
const DM = {
  MR:  {k:'MR',  l:'Market Research', c:'var(--mr)',   sa:'SA-1', d:'Tutoronics intel · competitor map · exam boards'},
  STR: {k:'STR', l:'Strategy',        c:'var(--str)',  sa:'SA-2', d:'Positioning · pricing · service model'},
  TECH:{k:'TECH',l:'Tech Build',      c:'var(--tech)', sa:'SA-3', d:'Stripe · WhatsApp Business · Calendly · landing'},
  TUT: {k:'TUT', l:'Tutor Pipeline',  c:'var(--tut)',  sa:'SA-4', d:'Spec · sourcing · screening · agreements'},
  GTM: {k:'GTM', l:'GTM',             c:'var(--gtm)',  sa:'SA-5', d:'Outreach · Instagram · content queue'},
  FIN: {k:'FIN', l:'Finance & Legal', c:'var(--fin)',  sa:'SA-0', d:'Pricing · tutor agreement · T&Cs · payment flow'},
};

const T = [
  {id:'MR-001', dom:'MR',  t:'Document Tutoronics intelligence', d:'Pricing, session patterns, student pain points. No student names. Patterns only. You are already inside the market — capture it before leaving.', due:'2026-09-04', p:'P0', deps:[], blk:null, st:'Done', out:`Tutor payout: Rs. 2,250/hr. Filter Tutors takes 30% first-month commission on top.

Session format at Tutoronics: 1 hour, lecture or book reading. No structured deck, no quiz, no assignment close. Learners' Avenue sessions: quiz start + deck + video or assignment close — meaningfully different.

Student feedback pattern: students felt more engaged when connected to the tutor personally. Engagement is the gap Tutoronics does not fill.

Busy subjects: Business Studies and Physics at O/A Level.

Competitor rate map:
- Tutopiya: AED 45-65/hr (parent rate)
- Superprof: AED 80-250/hr — student rating 1.1/5
- EdFlik: AED 65-80/hr A-Level
- Spires: AED 140+/hr

Full file: workstreams/market-research/MR-001-tutoronics-intel.md`},
  {id:'MR-002', dom:'MR',  t:'Confirm UAE exam board split — CAIE vs Edexcel IAL for Business, Econ, English', d:'Tutor spec depends on this. Academic Dashboard in archive is the starting point. Confirm which boards dominate which Emirate.', due:'2026-09-04', p:'P0', deps:[], blk:null},
  {id:'MR-003', dom:'MR',  t:'Map 3 competitor agencies in UAE O/A-level', d:'Pricing, subjects, weaknesses, parent complaints. Know what exists before claiming to be better.', due:'2026-09-05', p:'P0', deps:['MR-001'], blk:null, st:'Done', out:`8 agencies mapped. Key findings:

Mid-tier: Tutopiya (AED 45-65/hr, free first session, 83% A*/A claim), Superprof (AED 80-250, open marketplace, 1.1/5 student rating), MyPrivateTutor (directory, no curation), Ustaad (curated since 2015, free first lesson).

Higher-tier: EdFlik (AED 65-80/hr A-Level, monthly progress reports), Spires (AED 140+, 50+ subjects, UK-origin), ALevel Tutor ae (AED 100-430, A-Level only), Dubai Tutors ae (AED 140-390, home visits).

The gap: Zero agencies have South Asian cultural positioning. Every agency sells hours. None sell structure, crash courses, diagnostics, or mentor support as named products.

Economics A-Level entries up 10.5% in 2026. Business Studies in top 10. Demand direction matches our subject selection.

Tutopiya tutor page format noted for SA-3 reference: filter by curriculum > subject > level. Card shows photo, qualifications, rate, board expertise, reviews.

Full file: workstreams/market-research/MR-003-competitor-teardown.md`},
  {id:'MR-004', dom:'MR',  t:'Identify 5 active South Asian parent groups in UAE', d:'Facebook and WhatsApp. Search "Pakistani parents Dubai", "South Asian moms Abu Dhabi", school-specific groups. Join as yourself, not as the brand.', due:'2026-09-07', p:'P1', deps:[], blk:null},
  {id:'MR-P2',  dom:'MR',  t:'Exploratory scan: Nigeria, South Africa, Kenya O-level demand', d:'Archive flagged these as high-volume. Nigeria 27, South Africa 20, UAE 13 data points. Timing: after UAE pilot proves the model.', due:'2026-10-01', p:'P2', deps:['MR-003'], blk:'UAE pilot first'},

  {id:'STR-001',dom:'STR', t:'Write the positioning statement', d:'One sentence: who you serve, what transformation you deliver, why better than alternatives. Everything else (pricing, pitch, bio) references this.', due:'2026-09-05', p:'P0', deps:['MR-001','MR-003'], blk:null, st:'NeedsApproval', out:`Direction (from Minahil): "Where young entrepreneurial minds engage with syllabus content in a way that bridges the practical and theoretical for mastery in exams and life."

Full file: workstreams/strategy/STR-001-positioning.md`},
  {id:'STR-002',dom:'STR', t:'Product framework — support types and tracks', d:'Determines how tutors are paid, how you pitch to parents, what you can operate solo. A curated agency means you select and vouch — not self-listing.', due:'2026-09-05', p:'P0', deps:[], blk:null, st:'Approved', out:`APPROVED by Minahil, Sep 3 session.

Entry point (universal): Diagnostic Session — maps gaps, produces written plan, primary conversion tool.

Track 1 (Ongoing Support): Monthly Plan (auto-renews, best rate, priority scheduling, includes Mentor Check-in) + Single Session (pay per session, same format, higher rate).

/* STATE */
let S = {view:'domain', dom:'MR', tabs:{}, ex:new Set(), cex:new Set(), ts:{}, cs:{}};
function load(){try{const r=localStorage.getItem('la-os');if(r){const p=JSON.parse(r);S.ts=p.ts||{};S.cs=p.cs||{};S.view=p.view||'domain';S.dom=p.dom||'MR';}}catch(e){}}
function save(){try{localStorage.setItem('la-os',JSON.stringify({ts:S.ts,cs:S.cs,view:S.view,dom:S.dom}));}catch(e){}}
function gts(id){return S.ts[id]||(T.find(t=>t.id===id)||{}).st||'Draft'}
function gcs(id){return S.cs[id]||'Draft'}

/* STATUS */
const SCYCLE=['Draft','Progress','Done','Blocked'];
const SLABEL={Draft:'Draft',Progress:'In Progress',Done:'Done',Blocked:'Blocked',NeedsApproval:'Needs Approval',Approved:'Approved',Posted:'Posted'};
const SCLS={Draft:'sDraft',Progress:'sProgress',Done:'sDone',Blocked:'sBlocked',NeedsApproval:'sNeedsApproval',Approved:'sApproved',Posted:'sPosted'};
const CCYCLE=['Draft','NeedsApproval','Approved','Posted'];

/* HELPERS */
function du(ds){const t=new Date(ds),n=new Date();t.setHours(0,0,0,0);n.setHours(0,0,0,0);return Math.ceil((t-n)/86400000)}
function fd(ds){return new Date(ds).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function dc(d,st){if(st==='Done')return'dn';if(d<=3)return'hot';if(d<=6)return'warm';return'ok'}
function urg(d){if(d<=0)return{c:'hot',t:'TODAY'};if(d===1)return{c:'hot',t:'tmrw'};if(d<=3)return{c:'hot',t:d+'d'};if(d<=6)return{c:'warm',t:d+'d'};return{c:'ok',t:d+'d'}}
function e(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function domColor(k){const m={MR:'var(--mr)',STR:'var(--str)',TECH:'var(--tech)',TUT:'var(--tut)',GTM:'var(--gtm)',FIN:'var(--fin)'};return m[k]||'#888'}

function countdown(){const t=new Date('2026-09-15T23:59:00+05:00');return Math.max(0,Math.ceil((t-new Date())/86400000))}
function p0rem(){return T.filter(t=>t.p==='P0'&&gts(t.id)!=='Done').length}
function capprove(){return CONTENT.filter(c=>gcs(c.id)==='NeedsApproval').length}
function domp0(k){return T.filter(t=>t.dom===k&&t.p==='P0'&&gts(t.id)!=='Done').length}
function domca(k){if(k!=='GTM')return 0;return CONTENT.filter(c=>gcs(c.id)==='NeedsApproval').length}

function rTT(tasks, showDom){
  if(!tasks.length)return`<div class="empty">No tasks here.</div>`;
  const rows=tasks.map(t=>{
    const st=gts(t.id),d=du(t.due),ex=S.ex.has(t.id);
    const depr=t.deps.length?t.deps.map(dep=>`<span class="dep" onclick="gt('${dep}',event)">${dep}</span>`).join(''):`<span class="dash">—</span>`;
    const detrow=ex?`<tr class="td-row" id="td-${t.id}"><td colspan="${showDom?9:8}">
      <div class="td-inner">
        <div class="td-desc">${e(t.d)}</div>
        ${t.out?`<div class="td-out"><div class="td-out-label">Output</div><div class="td-out-body">${e(t.out)}</div></div>`:''}
        <div class="td-grid" style="margin-top:${t.out?'12px':'4px'}">
          ${t.blk?`<div><span class="tlabel">Blocker</span><span class="blk">${e(t.blk)}</span></div>`:''}
          ${t.deps.length?`<div><span class="tlabel">Dependencies</span><div class="deps">${t.deps.map(dep=>`<span class="dep" onclick="gt('${dep}',event)">${dep}</span>`).join('')}</div></div>`:''}
        </div>
      </div>
    </td></tr>`:'';
    return`<tr class="tr ${ex?'ex':''}" id="tr-${t.id}" onclick="te('${t.id}')">
      <td><span class="tid">${t.id}</span></td>
      ${showDom?`<td><span class="dtag dom-${t.dom}">${t.dom}</span></td>`:''}
      <td><span class="ttitle">${e(t.t)}</span></td>
      <td><span class="tdate ${dc(d,st)}">${fd(t.due)}</span></td>
      <td><span class="prio p${t.p}">${t.p}</span></td>
      <td onclick="event.stopPropagation()"><button class="sbtn ${SCLS[st]}" onclick="ct('${t.id}',event)">${SLABEL[st]}</button></td>
      <td>${t.blk?`<span class="blk">⚑</span>`:`<span class="dash">—</span>`}</td>
      <td><div class="deps">${depr}</div></td>
      <td><span class="xi ${ex?'o':''}">▶</span></td>
    </tr>${detrow}`;
  }).join('');
  return`<div class="tw"><table class="tt"><thead><tr>
    <th>ID</th>${showDom?'<th>Domain</th>':''}
    <th>Task</th><th>Due</th><th>Priority</th><th>Status</th><th>Blk</th><th>Dependencies</th><th></th>
  </tr></thead><tbody>${rows}</tbody></table></div>`;
}

  if(!rs.length)return`<div class="empty">No resources tracked yet.</div>`;
  return`<div class="rg">${rs.map(r=>`<div class="rc">
    <div class="rtype">${e(r.t)}</div>
    <div class="rname">${e(r.n)}</div>
    <div class="rdesc">${e(r.d)}</div>
    <div class="rstatus"><span class="rdot ${r.s}"></span><span class="rsl">${r.s==='exists'?'Available':r.s==='pending'?'Needs creating':'Draft'}</span></div>
  </div>`).join('')}</div>`;
}

/* RENDER URGENT STRIP */
function rUS(k){
  const ut=T.filter(t=>t.dom===k&&gts(t.id)!=='Done').sort((a,b)=>{const pa=a.p==='P0'?0:a.p==='P1'?1:2,pb=b.p==='P0'?0:b.p==='P1'?1:2;if(pa!==pb)return pa-pb;return new Date(a.due)-new Date(b.due)}).slice(0,3);
  if(!ut.length)return'';
  return`<div class="ustrip">${ut.map(t=>{const d=du(t.due),u=urg(d);return`<div class="ucard ${t.p==='P0'?'p0':'p1'}" onclick="gt('${t.id}',event)">
    <div class="ucard-top"><span class="uid">${t.id}</span><span class="udays ${u.c}">${u.t}</span></div>
    <div class="utitle">${e(t.t.length>62?t.t.slice(0,59)+'…':t.t)}</div>
  </div>`}).join('')}</div>`;
}

/* RENDER PROGRESS BAR */
function rPB(tasks,color){
  const total=tasks.filter(t=>t.p!=='P2').length,done=tasks.filter(t=>t.p!=='P2'&&gts(t.id)==='Done').length;
  if(!total)return'';
  const pct=Math.round(done/total*100);
  return`<div class="pbar-wrap">
    <div class="pbar-meta">
      <span class="pbar-label">${done} of ${total} tasks done</span>
      <span class="pbar-pct">${pct}%</span>
    </div>
    <div class="pbar-track"><div class="pbar-fill" style="width:${pct}%;background:${color}"></div></div>
  </div>`;
}

/* RENDER DOMAIN VIEW */
function rDV(){
  const k=S.dom,m=DM[k],tab=S.tabs[k]||'tasks';
  const dt=T.filter(t=>t.dom===k),hasC=k==='GTM';
  const p0c=dt.filter(t=>t.p==='P0'&&gts(t.id)!=='Done').length;
  const ca=hasC?CONTENT.filter(c=>gcs(c.id)==='NeedsApproval').length:0;
  const body=tab==='tasks'?rTT(dt.filter(t=>t.p!=='P2')):tab==='p2'?rTT(dt.filter(t=>t.p==='P2')):tab==='content'?rCQ():rRes(k);
  const hasP2=dt.some(t=>t.p==='P2');
  return`
    <div class="dh">
      <span class="dtag-lg dom-${k}" style="background:rgba(0,0,0,.2);border:1px solid ${m.c}40;color:${m.c}">${k}</span>
      <span class="dtitle">${m.l}</span>
      <span class="dsub">${m.d}</span>
    </div>
    ${rPB(dt,m.c)}
    ${rUS(k)}
    <div class="tabs" style="--dc:${m.c}">
      <button class="tab ${tab==='tasks'?'on':''}" onclick="stab('${k}','tasks')">Tasks${p0c?`<span class="tbadge">${p0c} P0</span>`:''}</button>
      ${hasP2?`<button class="tab ${tab==='p2'?'on':''}" onclick="stab('${k}','p2')">P2 Backlog</button>`:''}
      <button class="tab ${tab==='resources'?'on':''}" onclick="stab('${k}','resources')">Resources</button>
      ${hasC?`<button class="tab ${tab==='content'?'on':''}" onclick="stab('${k}','content')">Content${ca?`<span class="tbadge">${ca} ▲</span>`:''}</button>`:''}
    </div>
    ${body}`;
}

/* RENDER STAGE VIEW */
function rSV(){
  return[
    {k:'P0',l:'Do First — These Block Everything',s:'Complete before moving to P1.',cls:'p0'},
    {k:'P1',l:'By Sep 15 — Launch Infrastructure',s:'Everything parents see when outreach converts.',cls:'p1'},
    {k:'P2',l:'Post-Launch — First 30 Days',s:'Only after first booking confirmed.',cls:'p2'},
  ].map(st=>{
    const tasks=T.filter(t=>t.p===st.k),rem=tasks.filter(t=>gts(t.id)!=='Done').length;
    return`<div class="ss">
      <div class="sh">
        <span class="sbig ${st.cls}">${st.k}</span>
        <span class="stitle">${st.l}</span>
        <span class="scnt">${rem} remaining / ${tasks.length}</span>
        <span class="snote">${st.s}</span>
      </div>
      ${rTT(tasks,true)}
    </div>`;
  }).join('');
}

/* MAIN RENDER */
function R(){
  rTB();rSB();
  document.getElementById('MAIN').innerHTML=S.view==='stage'?rSV():rDV();
}

/* EVENTS */
function sv(v){S.view=v;save();R()}
function sd(k){S.dom=k;S.view='domain';save();R()}
function stab(k,t){S.tabs[k]=t;R()}
function te(id){S.ex.has(id)?S.ex.delete(id):S.ex.add(id);R()}
function ce(id){S.cex.has(id)?S.cex.delete(id):S.cex.add(id);R()}
function ct(id,ev){ev.stopPropagation();const cur=gts(id),i=SCYCLE.indexOf(cur),n=SCYCLE[(i+1)%SCYCLE.length];S.ts[id]=n;save();R()}
function sc(id,st,ev){ev.stopPropagation();S.cs[id]=st;save();R()}
function gt(tid,ev){
  ev.stopPropagation();
  const task=T.find(t=>t.id===tid);if(!task)return;
  S.view='domain';S.dom=task.dom;S.tabs[task.dom]='tasks';S.ex.add(tid);R();
  setTimeout(()=>{const el=document.getElementById('tr-'+tid);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},60);
}

load();R();
setInterval(()=>{rTB();},60000);
</script>
